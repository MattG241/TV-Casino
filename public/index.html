<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0e17">
  <title>TV Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header" id="mainHeader">
      <div class="logo">TV CASINO</div>
      <div class="logo-sub">Play on Phone &bull; Watch on TV</div>
    </div>

    <!-- JOIN SCREEN -->
    <div class="screen active" id="joinScreen">
      <div class="avatar-picker" id="avatarPicker"></div>
      <div class="join-form">
        <div class="input-group">
          <input type="text" id="playerName" placeholder="Your Name" maxlength="12" autocomplete="off">
        </div>
        <div class="input-group">
          <input type="text" id="roomCode" placeholder="Room Code" maxlength="4" autocomplete="off" class="room-code-input">
        </div>
        <button class="btn btn-gold btn-block btn-join" onclick="joinRoom()">JOIN GAME</button>
      </div>
    </div>

    <!-- SELFIE SCREEN -->
    <div class="screen" id="selfieScreen">
      <div class="selfie-wrap">
        <div class="selfie-title">🏇 JOCKEY SETUP</div>
        <div class="selfie-subtitle">Your face goes on your jockey in the 3D race</div>

        <div class="selfie-cam-area" id="selfieCamArea">
          <video id="selfieVideo" autoplay playsinline muted></video>
          <canvas id="selfieCanvas" style="display:none" width="240" height="240"></canvas>
          <img id="selfieImg" alt="Your selfie" style="display:none">
          <div class="selfie-cam-ring"></div>
        </div>

        <div class="selfie-btns">
          <button class="btn btn-gold selfie-snap-btn" id="selfieSnapBtn" onclick="captureSelfie()">📸 TAKE PHOTO</button>
          <button class="btn btn-outline selfie-retake-btn" id="selfieRetakeBtn" style="display:none" onclick="retakeSelfie()">↩ RETAKE</button>
        </div>

        <div class="selfie-horse-name-wrap">
          <div class="selfie-horse-label">NAME YOUR HORSE</div>
          <input class="selfie-horse-input" id="horseNameInput" type="text" placeholder="e.g. Thunder King" maxlength="20" autocomplete="off">
        </div>

        <button class="btn btn-gold btn-block selfie-go-btn" onclick="completeSelfie()">🏇 ENTER THE RACE</button>
        <button class="btn btn-outline selfie-skip-btn" onclick="skipSelfie()">Skip photo →</button>
      </div>
    </div>

    <!-- LOBBY SCREEN (waiting for everyone) -->
    <div class="screen" id="lobbyScreen">
      <div class="room-header">
        <div>
          <div style="font-size:11px;color:var(--text-dim)">ROOM</div>
          <div class="room-code" id="displayRoomCode"></div>
        </div>
        <div class="chips-display">
          <span class="chip-icon">$</span>
          <span id="myChips">1000</span>
        </div>
      </div>
      <div class="players-bar" id="playersBar"></div>
      <div id="lobbyContent">
        <div class="lobby-waiting-msg">Waiting for everyone to join...</div>
        <button class="btn btn-gold btn-block btn-everyones-in" id="everyonesInBtn" onclick="everyonesIn()">
          EVERYONE'S IN!
        </button>
        <div class="lobby-player-count" id="lobbyPlayerCount"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="room-header">
        <div>
          <div style="font-size:11px;color:var(--text-dim)">ROOM</div>
          <div class="room-code" id="gameRoomCode"></div>
        </div>
        <div class="chips-display">
          <span class="chip-icon">$</span>
          <span id="gameChips">1000</span>
        </div>
      </div>
      <div class="players-bar" id="gamePlayersBar"></div>

      <div id="gameArea">
        <!-- placeholder for removed games (kept so showGameUI doesn't crash) -->
        <div class="game-view" id="rouletteGame"></div>
        <div class="game-view" id="slotsGame"></div>
        <div class="game-view" id="blackjackGame"></div>
        <div class="game-view" id="pokerGame"></div>
        </div>

        <!-- HORSE RACING -->
        <div class="game-view" id="horseracingGame">
          <div id="horseracingContent"></div>
        </div>
      </div>

      <div class="end-game-section">
        <button class="btn btn-outline btn-block btn-end-game" id="endGameBtn" onclick="requestEndGame()">END GAME</button>
        <div class="end-game-status" id="endGameStatus"></div>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
