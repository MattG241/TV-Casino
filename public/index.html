<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0e17">
  <title>Race Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header" id="mainHeader">
      <div class="logo">RACE DAY</div>
      <div class="logo-sub">Bet on Phone &bull; Watch on TV</div>
    </div>

    <!-- JOIN SCREEN -->
    <div class="screen active" id="joinScreen">
      <div class="selfie-section">
        <div class="selfie-frame" id="selfieFrame" onclick="openCamera()">
          <video id="selfieVideo" autoplay playsinline muted style="display:none"></video>
          <canvas id="selfieCanvas" width="200" height="200" style="display:none"></canvas>
          <img id="selfiePreview" style="display:none" alt="Your selfie">
          <div class="selfie-placeholder" id="selfiePlaceholder">
            <div style="font-size:36px">📸</div>
            <div style="font-size:11px;margin-top:4px">TAP FOR SELFIE</div>
          </div>
          <button class="selfie-snap-btn" id="snapBtn" style="display:none" onclick="event.stopPropagation(); snapSelfie()">📷 SNAP</button>
          <button class="selfie-retake-btn" id="retakeBtn" style="display:none" onclick="event.stopPropagation(); retakeSelfie()">↺ RETAKE</button>
        </div>
      </div>
      <div class="join-form">
        <div class="input-group">
          <input type="text" id="playerName" placeholder="Your Name" maxlength="12" autocomplete="off">
        </div>
        <div class="input-group">
          <input type="text" id="horseName" placeholder="Name Your Horse" maxlength="20" autocomplete="off">
        </div>
        <div class="input-group">
          <input type="text" id="roomCode" placeholder="Room Code" maxlength="4" autocomplete="off" class="room-code-input">
        </div>
        <button class="btn btn-gold btn-block btn-join" onclick="joinRoom()">ENTER TRACKSIDE</button>
      </div>
    </div>

    <!-- LOBBY SCREEN (waiting for everyone) -->
    <div class="screen" id="lobbyScreen">
      <div class="room-header">
        <div>
          <div style="font-size:11px;color:var(--text-dim)">ROOM</div>
          <div class="room-code" id="displayRoomCode"></div>
        </div>
        <div class="chips-display">
          <span class="chip-icon">$</span>
          <span id="myChips">1000</span>
        </div>
      </div>
      <div class="players-bar" id="playersBar"></div>
      <div id="lobbyContent">
        <div class="lobby-waiting-msg">Waiting for everyone to join...</div>
        <button class="btn btn-gold btn-block btn-everyones-in" id="everyonesInBtn" onclick="everyonesIn()">
          START RACING
        </button>
        <div class="lobby-player-count" id="lobbyPlayerCount"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="room-header">
        <div>
          <div style="font-size:11px;color:var(--text-dim)">ROOM</div>
          <div class="room-code" id="gameRoomCode"></div>
        </div>
        <div class="chips-display">
          <span class="chip-icon">$</span>
          <span id="gameChips">1000</span>
        </div>
      </div>
      <div class="players-bar" id="gamePlayersBar"></div>

      <div id="gameArea">
        <!-- HORSE RACING -->
        <div class="game-view" id="horseracingGame">
          <div id="horseracingContent"></div>
        </div>
      </div>

      <div class="end-game-section">
        <button class="btn btn-outline btn-block btn-end-game" id="endGameBtn" onclick="requestEndGame()">NEW MEETING</button>
        <div class="end-game-status" id="endGameStatus"></div>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
