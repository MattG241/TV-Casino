<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Casino - TV Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tv.css">
</head>
<body>
  <!-- Fullscreen prompt disabled (not supported on Smart TVs) -->

  <div class="tv-container">
    <div class="tv-header">
      <div class="tv-logo">TV CASINO</div>
      <div class="tv-header-right">
        <div class="tv-room-code" id="tvRoomCode">----</div>
        <button class="tv-sound-toggle" id="soundToggle" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <div class="tv-game-area">
      <!-- Waiting Screen (QR code + floating players) -->
      <div class="tv-screen active" id="tvWaiting">
        <div class="tv-waiting-layout">
          <div class="tv-join-panel">
            <h2>Scan to Join</h2>
            <canvas id="qrCanvas" width="180" height="180"></canvas>
            <div class="tv-join-url" id="tvJoinUrl"></div>
            <div class="tv-join-code">Room: <strong id="tvJoinCode">----</strong></div>
          </div>
          <div class="tv-floating-area" id="tvFloatingArea">
            <!-- Floating player avatars appear here -->
            <div class="tv-waiting-text" id="tvWaitingText">Waiting for players...</div>
          </div>
        </div>
      </div>

      <!-- Voting Screen -->
      <div class="tv-screen" id="tvVoting">
        <div class="tv-voting">
          <h2>Vote for a Game!</h2>
          <div class="tv-vote-timer" id="tvVoteTimer"></div>
          <div class="tv-vote-grid" id="tvVoteGrid">
            <div class="tv-vote-card" data-game="roulette">
              <div class="tv-vote-icon">🎰</div>
              <div class="tv-vote-name">Roulette</div>
              <div class="tv-vote-bar"><div class="tv-vote-fill" id="tvVoteFill-roulette"></div></div>
              <div class="tv-vote-count" id="tvVoteCount-roulette">0</div>
            </div>
            <div class="tv-vote-card" data-game="slots">
              <div class="tv-vote-icon">🍒</div>
              <div class="tv-vote-name">Slots</div>
              <div class="tv-vote-bar"><div class="tv-vote-fill" id="tvVoteFill-slots"></div></div>
              <div class="tv-vote-count" id="tvVoteCount-slots">0</div>
            </div>
            <div class="tv-vote-card" data-game="blackjack">
              <div class="tv-vote-icon">🃏</div>
              <div class="tv-vote-name">Blackjack</div>
              <div class="tv-vote-bar"><div class="tv-vote-fill" id="tvVoteFill-blackjack"></div></div>
              <div class="tv-vote-count" id="tvVoteCount-blackjack">0</div>
            </div>
            <div class="tv-vote-card" data-game="poker">
              <div class="tv-vote-icon">♠️</div>
              <div class="tv-vote-name">Poker</div>
              <div class="tv-vote-bar"><div class="tv-vote-fill" id="tvVoteFill-poker"></div></div>
              <div class="tv-vote-count" id="tvVoteCount-poker">0</div>
            </div>
            <div class="tv-vote-card" data-game="horseracing">
              <div class="tv-vote-icon">🏇</div>
              <div class="tv-vote-name">Horses</div>
              <div class="tv-vote-bar"><div class="tv-vote-fill" id="tvVoteFill-horseracing"></div></div>
              <div class="tv-vote-count" id="tvVoteCount-horseracing">0</div>
            </div>
          </div>
          <div class="tv-voters" id="tvVoters"></div>
        </div>
      </div>

      <!-- Roulette TV -->
      <div class="tv-screen" id="tvRoulette">
        <div class="tv-players" id="tvPlayersRoulette"></div>
        <div class="tv-roulette" id="tvRouletteContent"></div>
      </div>

      <!-- Slots TV -->
      <div class="tv-screen" id="tvSlots">
        <div class="tv-players" id="tvPlayersSlots"></div>
        <div class="tv-slots" id="tvSlotsContent"></div>
      </div>

      <!-- Blackjack TV -->
      <div class="tv-screen" id="tvBlackjack">
        <div class="tv-players" id="tvPlayersBlackjack"></div>
        <div class="tv-blackjack" id="tvBlackjackContent"></div>
      </div>

      <!-- Poker TV -->
      <div class="tv-screen" id="tvPoker">
        <div class="tv-players" id="tvPlayersPoker"></div>
        <div class="tv-poker" id="tvPokerContent"></div>
      </div>

      <!-- Horse Racing TV -->
      <div class="tv-screen" id="tvHorseracing">
        <div class="tv-players" id="tvPlayersHorseracing"></div>
        <div class="tv-horseracing" id="tvHorseracingContent"></div>
      </div>
    </div>
  </div>

  <div class="confetti-container" id="confetti"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/tv-audio.js"></script>
  <script src="/js/race3d.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
